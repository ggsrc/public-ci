name: Update repository Template

on:
  workflow_call:
    secrets:
      CICD_DOCKER_BUILD_PAT:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - add-paths: .
            body: Use this to merge the changes to this repository.
            branch: cruft/update
            commit-message: "chore: accept new template repo update"
            title: New Template updates detected
          - add-paths: .cruft.json
            body: Use this to reject the changes in this repository.
            branch: cruft/reject
            commit-message: "chore: reject new template repo update"
            title: Reject new Template updates detected
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.10"

      - name: Install Cruft
        run: pip3 install cruft==2.16.0

      # Before the check: a private template can only be cloned with the token.
      - name: Use the token for GitHub clones
        env:
          TOKEN: ${{ secrets.CICD_DOCKER_BUILD_PAT }}
        run: |
          git config --global user.email "bot@ggsrc.com"
          git config --global user.name "cruft-bot"
          git config --global "url.https://${TOKEN}@github.com/.insteadOf" https://github.com/

      # cruft check exits 1 both when the project is out of date and when it
      # fails (for example, a template it cannot clone). Only the out-of-date
      # message means there is an update; any other failure fails the job
      # instead of opening update PRs.
      - name: Check if update is available
        id: check
        run: |
          if [ ! -f .cruft.json ]; then
            echo "No .cruft.json file"
            echo "has_changes=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          out=$(cruft check 2>&1) || status=$?
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "has_changes=0" >> "$GITHUB_OUTPUT"
          elif grep -q "cruft is out of date" <<<"$out"; then
            echo "has_changes=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cruft check failed (exit $status); see the output above"
            exit 1
          fi

      - name: Run update if available
        if: steps.check.outputs.has_changes == '1'
        run: |
          cruft update --skip-apply-ask --refresh-private-variables
          git restore --staged .

      - name: Create pull request
        if: steps.check.outputs.has_changes == '1'
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4.2.4
        with:
          token: ${{ secrets.CICD_DOCKER_BUILD_PAT }}
          add-paths: ${{ matrix.add-paths }}
          commit-message: ${{ matrix.commit-message }}
          branch: ${{ matrix.branch }}
          delete-branch: true
          branch-suffix: timestamp
          title: ${{ matrix.title }}
          body: |
            This is an autogenerated PR. ${{ matrix.body }}

            [Cruft](https://cruft.github.io/cruft/) has detected updates from the Template repository.