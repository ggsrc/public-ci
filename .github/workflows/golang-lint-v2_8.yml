name: golang lint v2.8

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.25'
      lint-version:
        description: 'golangci-lint version to use'
        required: false
        type: string
        default: 'v2.8'
    secrets:
      CICD_DOCKER_BUILD_PAT:
        description: 'Token for private Go modules (GOPRIVATE). Optional for public modules.'
        required: false

jobs:
  golangci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOPRIVATE: ${{ vars.GOPRIVATE }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.CICD_DOCKER_BUILD_PAT }}
    steps:
      - name: private module access
        if: env.GITHUB_ACCESS_TOKEN != ''
        run: git config --global url.https://$GITHUB_ACCESS_TOKEN@github.com/.insteadOf https://github.com/
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version || '1.25' }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: ${{ inputs.lint-version }}
