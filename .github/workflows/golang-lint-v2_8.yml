name: golang lint v2.8

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.25'
      lint-version:
        description: 'golangci-lint version to use'
        required: false
        type: string
        default: 'v2.8'
    secrets:
      CICD_DOCKER_BUILD_PAT:
        description: 'Token for private Go modules (GOPRIVATE). Optional for public modules.'
        required: false

jobs:
  golangci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOPRIVATE: ${{ vars.GOPRIVATE }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.CICD_DOCKER_BUILD_PAT }}
    steps:
      - name: private module access
        if: env.GITHUB_ACCESS_TOKEN != ''
        run: git config --global url.https://$GITHUB_ACCESS_TOKEN@github.com/.insteadOf https://github.com/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || '1.25' }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.lint-version }}
